[project]
name = "barnizgallery-ia"
version = "1.0.0"
description = "Servicio de IA de MUSEO, la galería del Barniz de Pasto Mopa-Mopa."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
